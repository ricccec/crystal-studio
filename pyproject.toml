[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-studio"
version = "0.5.0"
description = "Python terminal IDE for pret Gen-2 disassemblies, with plugins for vanilla and Polished Crystal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ricccec", email = "65662894+ricccec@users.noreply.github.com"}]
requires-python = ">=3.10"
dependencies = ["pret-toolkit", "crystal-studio-plugin-api", "textual>=8.2.8,<9", "rich"]

[project.scripts]
crystal-studio = "pretkit.studio:main"

# The mount discovers plugins through this group. The name is the
# seam's published ABI: every distribution that registers one has to
# spell it identically, and it is spelled once in code, in
# `contract/mount._GROUP`. Editing this needs a reinstall to take
# effect — entry points live in the dist metadata, not the source.
[project.entry-points."crystal_studio.plugins"]
vanilla  = "pretkit.hacks.vanilla.claim"
polished = "pretkit.hacks.polished.claim"

# `namespaces = true` is the whole split: `pretkit` is a
# PEP 420 namespace package with no `__init__.py`, so these
# distributions install side by side and answer as one package.
[project.urls]
Source = "https://github.com/ricccec/crystal-studio"
Issues = "https://github.com/ricccec/crystal-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
